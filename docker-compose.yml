x-app-image: &app-image
  image: django-lms:local
  build: .

services:
  db:
    image: postgres:16-alpine
    container_name: django_lms_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *app-image
    container_name: django_lms_web
    restart: unless-stopped
    command: >
      sh -c "uv run python manage.py collectstatic --noinput &&
             uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  backup:
    <<: *app-image
    container_name: django_lms_backup
    restart: unless-stopped
    command: >
      sh -c "uv run python manage.py migrate --noinput && while true; do
             uv run python manage.py backup_data --keep 48;
             sleep 3600;
             done"
    volumes:
      - .:/app
      - /app/.venv
      - ./backups:/app/backups
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
